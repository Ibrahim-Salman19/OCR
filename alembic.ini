[alembic]
script_location = blast_ocr/storage/alembic
file_template = %%(rev)s_%%(slug)s

# Minimal logging config alembic's fileConfig() actually needs (a bare
# `default_level = INFO` key was NOT valid python logging.fileConfig format --
# `alembic upgrade head` failed with KeyError: 'formatters' until this was
# fixed; see docs/adr/0009 for how this was discovered).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
