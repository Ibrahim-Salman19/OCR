[project]
name = "blast-ocr"
version = "3.0.0"
description = "Self-hosted OCR/document-intelligence pipeline (PDF/PPTX/image -> Markdown/DOCX/EPUB) with a native MCP server and LangChain/LlamaIndex loaders"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ibrahim Salman", email = "hafiz.muhammad.ibrahim.salman@gmail.com" }]
keywords = [
    "ocr",
    "pdf-to-markdown",
    "document-intelligence",
    "table-extraction",
    "onnx",
    "rapidocr",
    "mcp",
    "model-context-protocol",
    "langchain",
    "llamaindex",
    "rag",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/Ibrahim-Salman19/OCR"
Repository = "https://github.com/Ibrahim-Salman19/OCR"
Documentation = "https://github.com/Ibrahim-Salman19/OCR/blob/main/docs/INTRODUCTION.md"
"Live Demo" = "https://ocr-book.streamlit.app/"
Changelog = "https://github.com/Ibrahim-Salman19/OCR/blob/main/CHANGELOG.md"
Issues = "https://github.com/Ibrahim-Salman19/OCR/issues"

# requirements.txt (the "CRITICAL STABILITY CORE" pins, notably
# streamlit==1.32.0 for Python <3.14) is the actual source of truth --
# verified by a real `docker build`, not just inspection -- and this list
# mirrors it exactly rather than diverging with independently-chosen newer
# pins. An earlier version of this file pinned streamlit==1.61.1 and pulled
# opentelemetry-exporter-otlp into the observability extra unconditionally;
# combined, those silently assumed a streamlit upgrade that was never
# actually verified, and building the real Docker image caught a genuine
# resolver conflict (protobuf<5 required by streamlit==1.32.0 vs protobuf>=5
# required by opentelemetry-exporter-otlp) that a purely notional pin list
# would never have surfaced. See docs/adr/0013.
dependencies = [
    "streamlit==1.32.0; python_version < '3.14'",
    "streamlit>=1.56.0,<2; python_version >= '3.14'",
    "defusedxml==0.7.1",
    "pandas==2.2.1; python_version < '3.14'",
    "pandas>=2.3.3,<3; python_version >= '3.14'",
    "pydantic==2.6.3; python_version < '3.14'",
    "pydantic>=2.12.3,<3; python_version >= '3.14'",
    "numpy<2.0.0; python_version < '3.14'",
    "numpy>=2.3.0,<3; python_version >= '3.14'",
    "easyocr>=1.7.0",
    "rapidocr_onnxruntime>=1.3.0",
    "pypdfium2>=4.30.0",
    "pillow<11; python_version < '3.14'",
    "pillow>=12,<13; python_version >= '3.14'",
    "opencv-python-headless>=4.8.0",
    "pdf2image>=1.17.0",
    "langdetect>=1.0.9",
    "lxml>=5.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "python-pptx>=0.6.21",
    "python-docx>=1.1.0",
    "tqdm>=4.66.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
# Mirrors requirements-production.txt. Durable queue (config.queue_backend=
# "redis", docs/adr/0010) + object storage (config.storage_backend="s3",
# docs/adr/0011) + observability (docs/adr/0012) + API server + PDF acceleration.
# Deliberately excludes opentelemetry-exporter-otlp -- see the dependencies
# comment above and requirements-production.txt for why.
queue = ["rq>=2.0.0", "redis>=5.0.0"]
storage = ["boto3>=1.34.0"]
observability = ["opentelemetry-sdk>=1.24.0", "prometheus-client>=0.20.0"]
api = [
    "fastapi>=0.109.0,<0.113.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.9",
]
pdf = ["pymupdf>=1.23.0"]
production = ["blast-ocr[queue,storage,observability,api,pdf]"]
# Test-only fakes so tests/test_queue.py and tests/test_object_store.py can
# exercise queue/storage code paths without live infrastructure where noted.
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.165.2",
    "fakeredis>=2.20.0",
    "moto>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "bandit>=1.7.9",
    "pip-audit>=2.7.3",
    "jiwer>=3.0.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["poppler-25.12.0", ".devcontainer", "architecture"]

[tool.ruff.lint]
# Start narrow and provably-clean rather than "fix everything at once": unused
# imports/variables (F401/F841) and bare-except discipline (E722) are the
# highest-signal, lowest-noise checks to gate CI on immediately. Broaden this
# list incrementally in follow-up PRs rather than enabling everything and
# drowning the first CI run in pre-existing findings.
select = ["E722", "F401", "F811", "F841"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Same incremental philosophy as ruff above: strict-mode gating on a 25k-line
# pre-existing codebase would fail wall-to-wall on day one and get disabled
# out of frustration. check_untyped_defs catches real bugs (wrong attribute
# access, etc.) inside untyped functions without demanding the whole codebase
# add annotations first.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["poppler-25.12.0/", "architecture/", "tests/"]

[tool.bandit]
# B108 (hardcoded /tmp path) is bandit's only finding across blast_ocr/ (7
# occurrences, 0 High severity). Every occurrence is the same deliberate,
# already-commented pattern: falling back to /tmp as a guaranteed-writable
# cache/log/output directory on Streamlit Community Cloud, where the app's
# own working directory may not be writable. Skipping this specific check
# (verified: no other bandit finding exists to hide behind it) rather than
# disabling the whole scan, so a genuinely new finding of a different type
# still fails CI.
skips = ["B108"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["blast_ocr"]
