[pytest]
pythonpath = .
addopts = -p no:doctest
# Keep warning signal high: fail on new warnings by default, while
# suppressing known third-party deprecations/user warnings we don't control.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*import python_multipart.*:PendingDeprecationWarning
    ignore::UserWarning
    ignore::ResourceWarning
markers =
    real_easyocr: run test with real EasyOCR reader instead of default mocked fixture
    eval_regression: compares the latest eval/results scorecard against the
        committed baseline; requires `python eval/run.py` to have been run
        first, and is skipped (not failed) when no fresh scorecard exists
    real_arabic_model: downloads and runs the real PP-OCRv5 Arabic-script
        ONNX model (~8MB) instead of mocking it; skipped (not failed) if
        unreachable
    playwright: Playwright browser end-to-end tests for UI and REST API
