[pytest]
addopts = -p no:doctest
# Keep warning signal high: fail on new warnings by default, while
# suppressing known third-party deprecations/user warnings we don't control.
filterwarnings =
    error
    ignore:defusedxml\.cElementTree is deprecated, import from defusedxml\.ElementTree instead\.:DeprecationWarning
    ignore:torch\.ao\.quantization is deprecated and will be removed in 2\.10\.:DeprecationWarning:easyocr\.detection
    ignore:torch\.ao\.quantization is deprecated and will be removed in 2\.10\.:DeprecationWarning:easyocr\.recognition
    ignore:torch\.ao\.quantization is deprecated and will be removed in 2\.10\.:DeprecationWarning:torch\.ao\.quantization\.quantize
    ignore:'pin_memory' argument is set as true but no accelerator is found, then device pinned memory won't be used\.:UserWarning:torch\.utils\.data\.dataloader
markers =
    real_easyocr: run test with real EasyOCR reader instead of default mocked fixture
